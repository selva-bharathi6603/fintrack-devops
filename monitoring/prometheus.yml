global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape the FinTrack app running in Minikube
  # Replace <MINIKUBE_IP> with output of: minikube ip
  - job_name: 'fintrack'
    static_configs:
      - targets: ['host.docker.internal:30080']
    metrics_path: /metrics
    scrape_interval: 10s

  # Scrape Jenkins metrics (requires Prometheus Jenkins plugin)
  - job_name: 'jenkins'
    static_configs:
      - targets: ['jenkins:8080']
    metrics_path: /prometheus
